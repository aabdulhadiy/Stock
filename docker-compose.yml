services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stockdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stockdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://stock:stock@db:5432/stockdb
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-0123456789abcdef}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@toy.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
      SEED_EXCHANGE_RATE: ${SEED_EXCHANGE_RATE:-12600}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
